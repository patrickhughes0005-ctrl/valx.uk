services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valx
      POSTGRES_USER: valx
      POSTGRES_PASSWORD: valx_local_only
    ports:
      - "5432:5432"
    volumes:
      - valx_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valx -d valx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valx_postgres:

